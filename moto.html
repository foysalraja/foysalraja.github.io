<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Moto Rider | Foysal Raja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        #game-container { position: relative; width: 100%; height: 60vh; max-height: 500px; overflow: hidden; border-radius: 10px; border: 3px solid #00d4ff; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* স্কোর ও কন্ট্রোল প্যানেল */
        .game-ui {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: #111827; border-radius: 10px;
            margin-bottom: 10px; border: 1px solid #1e293b;
        }
        .score-text { color: #fff; font-size: 1.2rem; font-weight: 700; }
        .score-text span { color: #00d4ff; }
        
        .mobile-controls { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .ctrl-btn { width: 70px; height: 70px; font-size: 1.5rem; background: #1e293b; color: #00d4ff; border: 2px solid #00d4ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; user-select: none; -webkit-tap-highlight-color: transparent; }
        .ctrl-btn:active { background: #00d4ff; color: #0b1120; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><img src="logo.jpg" alt="FR Logo" class="logo-img"><span>Foysal Raja</span></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="game.html" class="active">Games</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </nav>

    <div style="padding: 10px 5%; max-width: 600px; margin: 0 auto;">
        <a href="game.html" style="color: #00d4ff; text-decoration: none; display: inline-block; margin-bottom: 10px;">← Back to Games</a>
        <h2 style="color: #fff; text-align: center; margin-bottom: 10px;">3D Moto Rider 🏍️</h2>
        
        <div class="game-ui">
            <div class="score-text">Score: <span id="score">0</span></div>
            <button class="btn" onclick="startGame()" id="startBtn" style="padding: 8px 15px; font-size: 0.9rem;">Start</button>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="mobile-controls">
            <div class="ctrl-btn" onmousedown="moveLeft()" onmouseup="stopMove()" onmouseleave="stopMove()" ontouchstart="moveLeft()" ontouchend="stopMove()">⬅️</div>
            <div class="ctrl-btn" onmousedown="moveRight()" onmouseup="stopMove()" onmouseleave="stopMove()" ontouchstart="moveRight()" ontouchend="stopMove()">➡️</div>
        </div>
    </div>

    <div class="victory-modal" id="victoryModal">
        <div class="victory-content">
            <h2 id="victoryTitle">Game Over!</h2>
            <p id="victoryText">Your Score: 0</p>
            <button class="btn" onclick="playAgainAction()">Play Again</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Hamburger Menu Logic
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => { hamburger.classList.toggle('active'); navLinks.classList.toggle('active'); });
            document.querySelectorAll('.nav-links a').forEach(link => { link.addEventListener('click', () => { hamburger.classList.remove('active'); navLinks.classList.remove('active'); }); });
        }

        let scene, camera, renderer, moto, obstacles = [], score = 0, isPlaying = false, gameInterval, dayTime = 0;
        let velocityX = 0, currentSpeed = 0.5;
        const canvasContainer = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0b1120, 10, 80);

            camera = new THREE.PerspectiveCamera(70, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);
            camera.lookAt(0, 1, -5);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
            renderer.shadowMap.enabled = true;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); scene.add(ambientLight);
            const sunLight = new THREE.DirectionalLight(0xffa500, 1); sunLight.position.set(10, 20, 10); scene.add(sunLight);

            // Environment
            const roadGeo = new THREE.PlaneGeometry(10, 200); roadGeo.rotateX(-Math.PI / 2);
            const roadMat = new THREE.MeshPhongMaterial({ color: 0x1e293b }); const road = new THREE.Mesh(roadGeo, roadMat); road.position.z = -100; scene.add(road);

            // Center Line
            for (let i = 0; i < 40; i++) {
                const lineGeo = new THREE.PlaneGeometry(0.2, 4); lineGeo.rotateX(-Math.PI / 2);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff }); const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.set(0, 0.01, -i * 6); scene.add(line);
            }

            // Trees
            const treeGeo = new THREE.ConeGeometry(1, 3, 8); const treeMat = new THREE.MeshLambertMaterial({ color: 0x10b981 });
            for(let i=0; i<20; i++) {
                let treeL = new THREE.Mesh(treeGeo, treeMat); treeL.position.set(-7, 1.5, -i * 10); scene.add(treeL);
                let treeR = new THREE.Mesh(treeGeo, treeMat); treeR.position.set(7, 1.5, -i * 10); scene.add(treeR);
            }

            // Moto Model (Simplified)
            const motoGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 2.5), new THREE.MeshPhongMaterial({color: 0x00d4ff}));
            body.position.y = 0.8; motoGroup.add(body);
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16); wheelGeo.rotateZ(Math.PI/2);
            const wheelMat = new THREE.MeshPhongMaterial({color: 0x111111});
            const w1 = new THREE.Mesh(wheelGeo, wheelMat); w1.position.set(0, 0.4, 1); motoGroup.add(w1);
            const w2 = new THREE.Mesh(wheelGeo, wheelMat); w2.position.set(0, 0.4, -1); motoGroup.add(w2);
            moto = motoGroup; scene.add(moto);

            window.addEventListener('resize', () => {
                camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isPlaying) {
                // Day/Night Cycle
                dayTime += 0.005;
                if (Math.sin(dayTime) > 0) { // Day
                    scene.background = new THREE.Color(0x87CEEB);
                    scene.fog.color.setHex(0x87CEEB);
                } else { // Night
                    scene.background = new THREE.Color(0x0b1120);
                    scene.fog.color.setHex(0x0b1120);
                }

                // Smooth Moto Movement
                moto.position.x += velocityX;
                if (moto.position.x > 3.5) moto.position.x = 3.5;
                if (moto.position.x < -3.5) moto.position.x = -3.5;

                // Move Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += currentSpeed;
                    if (obs.position.z > 5) {
                        scene.remove(obs); obstacles.splice(i, 1); score++;
                        document.getElementById('score').innerText = score;
                        if (score % 10 === 0) currentSpeed += 0.05; // Speed up
                    }
                    if (Math.abs(obs.position.x - moto.position.x) < 1.2 && Math.abs(obs.position.z - moto.position.z) < 1.5) { endGame(); }
                }
            }
            renderer.render(scene, camera);
        }

        function moveLeft() { velocityX = -0.15; }
        function moveRight() { velocityX = 0.15; }
        function stopMove() { velocityX = 0; }

        document.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft" || e.key === "a") moveLeft(); if (e.key === "ArrowRight" || e.key === "d") moveRight(); });
        document.addEventListener("keyup", (e) => { if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "a" || e.key === "d") stopMove(); });

        function createObstacle() {
            if (!isPlaying) return;
            const obsGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 3), new THREE.MeshPhongMaterial({ color: 0xef4444 }));
            body.position.y = 0.6; obsGroup.add(body);
            obsGroup.position.set((Math.random() - 0.5) * 6, 0, -80);
            scene.add(obsGroup); obstacles.push(obsGroup);
        }

        function startGame() {
            if (isPlaying) return;
            isPlaying = true; document.getElementById("startBtn").style.display = "none";
            if (scene) { obstacles.forEach(o => scene.remove(o)); obstacles = []; moto.position.x = 0; }
            score = 0; currentSpeed = 0.5; dayTime = Math.PI/2; document.getElementById('score').innerText = score;
            if (!scene) init3D();
            animate();
            clearInterval(gameInterval); gameInterval = setInterval(createObstacle, 1000);
        }

        function endGame() {
            isPlaying = false; clearInterval(gameInterval);
            document.getElementById("victoryText").innerText = "Your Score: " + score;
            document.getElementById("victoryModal").classList.add("active");
            document.getElementById("startBtn").style.display = "inline-block";
            document.getElementById("startBtn").innerText = "Play Again";
        }

        function playAgainAction() { document.getElementById("victoryModal").classList.remove("active"); startGame(); }
    </script>
</body>
</html>
