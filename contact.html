    <section class="contact-section">
        <div class="contact-container">
            <h2>Get in <span class="highlight">Touch</span></h2>
            <p>If you have any questions or want to work with me, send a message!</p>

            <!-- মেসেজ ফর্ম -->
            <form action="https://formsubmit.co/foysalraja07@gmail.com" method="POST">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Your Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" placeholder="Write your message here..." required></textarea>
                </div>
                <!-- ফর্ম সাবমিট হলে যেন সাকসেস মেসেজ দেখায় -->
                <input type="hidden" name="_next" value="https://foysalraja.github.io/contact.html">
                <button type="submit" class="btn" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </section>
