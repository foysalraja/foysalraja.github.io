<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Checkout | Foysal Raja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ডার্ক থিম পেমেন্ট পেজ */
        body { background: #0b1120; font-family: 'Poppins', sans-serif; color: #e2e8f0; }
        
        .checkout-container {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 40px 20px;
            background: radial-gradient(circle at top right, #1e293b, #0b1120);
        }

        .checkout-box {
            display: flex; width: 100%; max-width: 900px;
            background: #111827; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden; border: 1px solid #1e293b;
            flex-wrap: wrap;
        }

        /* বাম দিকের অর্ডার সামারি */
        .order-summary {
            flex: 1; background: #0f172a; padding: 40px;
            border-right: 1px solid #1e293b; min-width: 300px;
        }
        .order-summary h2 { font-size: 1.3rem; color: #fff; margin-bottom: 25px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem; color: #94a3b8; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 25px; padding-top: 20px; border-top: 1px solid #334155; font-weight: 700; font-size: 1.2rem; color: #00d4ff; }

        /* ডান দিকের পেমেন্ট সেকশন */
        .payment-section { flex: 1.2; padding: 40px; min-width: 300px; }
        .payment-section h2 { font-size: 1.5rem; color: #fff; margin-bottom: 5px; }
        .payment-section p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 25px; }

        /* পেমেন্ট মেথড গ্রিড */
        .payment-methods {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px;
        }
        .method-btn {
            background: #0b1120; border: 2px solid #334155; border-radius: 10px;
            padding: 12px; display: flex; align-items: center; gap: 10px;
            cursor: pointer; transition: 0.3s; color: #cbd5e1; font-weight: 500; font-size: 0.9rem;
        }
        .method-btn:hover { border-color: #00d4ff; }
        .method-btn.active { border-color: #00d4ff; background: rgba(0, 212, 255, 0.1); color: #00d4ff; box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }
        
        /* লোগো স্টাইল */
        .method-logo { width: 35px; height: 25px; object-fit: contain; border-radius: 3px; background: #fff; padding: 2px; }

        /* ফর্ম ফিল্ড */
        .form-group { margin-bottom: 18px; display: none; /* ডিফল্টভাবে লুকানো */ }
        .form-group.active { display: block; animation: fadeIn 0.3s; } /* সিলেক্ট করলে দেখাবে */
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: #94a3b8; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 14px 15px; background: #0b1120;
            border: 1px solid #334155; border-radius: 10px;
            font-size: 0.95rem; color: #fff; outline: none; transition: 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        .form-group input:focus { border-color: #00d4ff; box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }

        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }

        .pay-btn {
            width: 100%; padding: 16px; background: linear-gradient(90deg, #00d4ff, #8b5cf6);
            color: #fff; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; margin-top: 15px; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }
        .pay-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0, 212, 255, 0.4); }

        .secure-badge { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.8rem; color: #64748b; margin-top: 15px; }

        /* সাকসেস পপআপ */
        .success-popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 17, 32, 0.9); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .success-popup.active { opacity: 1; pointer-events: auto; }
        
        .popup-content {
            background: #111827; padding: 40px; border-radius: 20px;
            text-align: center; max-width: 350px; width: 90%;
            transform: translateY(20px); transition: transform 0.4s;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #00d4ff;
        }
        .success-popup.active .popup-content { transform: translateY(0); }

        .checkmark-circle {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(16, 185, 129, 0.2); display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px auto;
        }
        .checkmark { width: 25px; height: 45px; border-right: 5px solid #10b981; border-bottom: 5px solid #10b981; transform: rotate(45deg) translate(-2px, -5px); }
        .popup-content h2 { color: #fff; font-size: 1.4rem; margin-bottom: 10px; }
        .popup-content p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        
        .close-popup-btn {
            background: #00d4ff; color: #0b1120; border: none;
            padding: 12px 30px; border-radius: 10px; font-weight: 600;
            cursor: pointer; transition: 0.2s; width: 100%;
        }
        .close-popup-btn:hover { background: #0ea5e9; }

        @media (max-width: 768px) {
            .checkout-box { flex-direction: column; }
            .order-summary { border-right: none; border-bottom: 1px solid #1e293b; }
            .payment-methods { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="checkout-box">
            
            <!-- বাম দিকের অর্ডার সামারি -->
            <div class="order-summary">
                <h2>Order Summary</h2>
                <div class="summary-item"><span>Premium Membership</span><span>$99.00</span></div>
                <div class="summary-item"><span>Priority Delivery</span><span>$10.00</span></div>
                <div class="summary-item"><span>Estimated Tax</span><span>$4.00</span></div>
                <div class="summary-total"><span>Total due today</span><span>$113.00</span></div>
            </div>

            <!-- ডান দিকের পেমেন্ট মেথড -->
            <div class="payment-section">
                <h2>Payment Method</h2>
                <p>Select your preferred payment option.</p>
                
                <!-- পেমেন্ট মেথড বাটন (লোগোসহ) -->
                <div class="payment-methods">
                    <div class="method-btn active" onclick="showForm('card')">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1200px-Mastercard-logo.svg.png" class="method-logo" alt="Mastercard"> Visa/Mastercard
                    </div>
                    <div class="method-btn" onclick="showForm('bkash')">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/BKash_Logo.svg/1200px-BKash_Logo.svg.png" class="method-logo" alt="bKash"> bKash
                    </div>
                    <div class="method-btn" onclick="showForm('nagad')">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Nagad_Logo.svg/1200px-Nagad_Logo.svg.png" class="method-logo" alt="Nagad"> Nagad
                    </div>
                    <div class="method-btn" onclick="showForm('rocket')">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Rocket_Logo.svg/1200px-Rocket_Logo.svg.png" class="method-logo" alt="Rocket"> Rocket
                    </div>
                </div>

                <!-- পেমেন্ট ফর্ম -->
                <form id="paymentForm">
                    
                    <!-- কার্ড পেমেন্ট ফর্ম (ডিফল্ট) -->
                    <div class="form-group active" id="form-card">
                        <label>Cardholder Name</label>
                        <input type="text" placeholder="A. HASIB" required>
                        <label style="margin-top:10px;">Card Number</label>
                        <input type="text" placeholder="4242 4242 4242 4242" maxlength="19" required>
                        <div class="row">
                            <div class="form-group active" style="display:block; margin-top:10px;">
                                <label>Expiry Date</label>
                                <input type="text" placeholder="12/28" maxlength="5" required>
                            </div>
                            <div class="form-group active" style="display:block; margin-top:10px;">
                                <label>CVC</label>
                                <input type="password" placeholder="•••" maxlength="4" required>
                            </div>
                        </div>
                    </div>

                    <!-- বিকাশ পেমেন্ট ফর্ম -->
                    <div class="form-group" id="form-bkash">
                        <label>bKash Mobile Number</label>
                        <input type="tel" placeholder="017XX-XXXXXX" required>
                        <label style="margin-top:10px;">PIN</label>
                        <input type="password" placeholder="Enter your bKash PIN" required>
                    </div>

                    <!-- নগদ পেমেন্ট ফর্ম -->
                    <div class="form-group" id="form-nagad">
                        <label>Nagad Mobile Number</label>
                        <input type="tel" placeholder="017XX-XXXXXX" required>
                        <label style="margin-top:10px;">PIN</label>
                        <input type="password" placeholder="Enter your Nagad PIN" required>
                    </div>

                    <!-- রকেট পেমেন্ট ফর্ম -->
                    <div class="form-group" id="form-rocket">
                        <label>Rocket Account Number</label>
                        <input type="tel" placeholder="017XXXXXXXX" required>
                    </div>

                    <button type="submit" class="pay-btn">Pay $113.00 →</button>
                    <div class="secure-badge">🔒 Secure Payment </div>
                </form>
            </div>

        </div>
    </div>

    <!-- সাকসেস পপআপ -->
    <div class="success-popup" id="successPopup">
        <div class="popup-content">
            <div class="checkmark-circle">
                <div class="checkmark"></div>
            </div>
            <h2>Payment Successful!</h2>
            <p>Your transaction has been completed.</p>
            <button class="close-popup-btn" onclick="closePopup()">Done</button>
        </div>
    </div>

    <script>
        // পেমেন্ট মেথড পরিবর্তন করার ফাংশন
        function showForm(method) {
            // সব বাটন থেকে active ক্লাস সরানো
            document.querySelectorAll('.method-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // সব ফর্ম লুকানো
            document.querySelectorAll('.form-group').forEach(f => f.classList.remove('active'));

            // নির্দিষ্ট ফর্ম দেখানো
            if (method === 'card') document.getElementById('form-card').classList.add('active');
            if (method === 'bkash') document.getElementById('form-bkash').classList.add('active');
            if (method === 'nagad') document.getElementById('form-nagad').classList.add('active');
            if (method === 'rocket') document.getElementById('form-rocket').classList.add('active');
        }

        // সাবমিট করলে পপআপ দেখানো
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('successPopup').classList.add('active');
        });

        function closePopup() {
            document.getElementById('successPopup').classList.remove('active');
            document.getElementById('paymentForm').reset();
        }
    </script>
</body>
</html>
