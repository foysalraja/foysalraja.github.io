<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Checkout | Foysal Raja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* পেমেন্ট পেজের জন্য প্রিমিয়াম স্টাইল */
        .checkout-wrapper {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at top right, #1e293b, #0b1120);
        }

        .checkout-box {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            flex-wrap: wrap;
        }

        /* বাম দিকের কার্ড ভিজ্যুয়াল */
        .card-visual-section {
            flex: 1;
            min-width: 320px;
            padding: 40px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ৩ডি কার্ড অ্যানিমেশন */
        .credit-card {
            width: 320px;
            height: 200px;
            background: linear-gradient(135deg, #00d4ff, #8b5cf6);
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        /* কার্ডের চিপ */
        .card-chip {
            width: 50px;
            height: 35px;
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }
        
        .card-chip::after {
            content: '';
            position: absolute;
            top: 0; left: 50%; width: 1px; height: 100%; background: rgba(0,0,0,0.2);
        }

        .card-number-display {
            font-size: 1.5rem;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .card-bottom div span {
            display: block;
            font-size: 0.6rem;
            opacity: 0.7;
            margin-bottom: 2px;
        }

        /* ডান দিকের ফর্ম */
        .form-section {
            flex: 1.2;
            min-width: 320px;
            padding: 40px;
        }

        .form-section h2 { color: #fff; font-size: 1.8rem; margin-bottom: 5px; }
        .form-section p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; color: #cbd5e1; font-size: 0.85rem; margin-bottom: 8px; font-weight: 500; }
        
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(11, 17, 32, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        
        .input-group input:focus { border-color: #00d4ff; box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }

        .row { display: flex; gap: 15px; }
        .row .input-group { flex: 1; }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00d4ff, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0, 212, 255, 0.4); }

        /* সাকসেস মেসেজ */
        .success-msg { display: none; background: #10b981; color: #fff; padding: 15px; border-radius: 10px; text-align: center; margin-top: 20px; font-weight: bold; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .checkout-box { flex-direction: column; }
            .card-visual-section { padding: 30px 20px; }
            .credit-card { width: 280px; height: 175px; }
        }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <nav class="navbar">
        <div class="logo"><img src="logo.jpg" alt="FR Logo" class="logo-img"><span>Foysal Raja</span></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="game.html">Games</a></li>
            <li><a href="checkout.html" class="active">Checkout</a></li>
        </ul>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </nav>

    <!-- পেমেন্ট সেকশন -->
    <div class="checkout-wrapper">
        <div class="checkout-box">
            
            <!-- বাম দিকের ৩ডি কার্ড -->
            <div class="card-visual-section">
                <div class="credit-card" id="creditCard">
                    <div class="card-chip"></div>
                    <div class="card-number-display" id="displayCardNumber">•••• •••• •••• ••••</div>
                    <div class="card-bottom">
                        <div>
                            <span>Card Holder</span>
                            <div id="displayName">YOUR NAME</div>
                        </div>
                        <div>
                            <span>Expires</span>
                            <div id="displayExpiry">MM/YY</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ডান দিকের ফর্ম -->
            <div class="form-section">
                <h2>Payment Details</h2>
                <p>Enter your card details to complete the secure transaction.</p>
                
                <form id="paymentForm">
                    <div class="input-group">
                        <label>Cardholder Name</label>
                        <input type="text" id="cardName" placeholder="e.g. FOYSAL RAJA" required maxlength="22">
                    </div>
                    <div class="input-group">
                        <label>Card Number</label>
                        <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" required maxlength="19">
                    </div>
                    <div class="row">
                        <div class="input-group">
                            <label>Expiry Date</label>
                            <input type="text" id="cardExpiry" placeholder="MM/YY" required maxlength="5">
                        </div>
                        <div class="input-group">
                            <label>CVC</label>
                            <input type="password" placeholder="•••" required maxlength="4">
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">Pay $1,248.00 →</button>
                </form>
                
                <div class="success-msg" id="successMsg">✅ Payment Successful! (Demo Only)</div>
            </div>

        </div>
    </div>

    <script>
        // হ্যামবার্গার মেনু
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => { hamburger.classList.toggle('active'); navLinks.classList.toggle('active'); });
            document.querySelectorAll('.nav-links a').forEach(link => { link.addEventListener('click', () => { hamburger.classList.remove('active'); navLinks.classList.remove('active'); }); });
        }

        // ইনপুট ফিল্ডের সাথে কার্ডের ভিজ্যুয়াল আপডেট
        const cardNumberInput = document.getElementById('cardNumber');
        const cardNameInput = document.getElementById('cardName');
        const cardExpiryInput = document.getElementById('cardExpiry');

        const displayCardNumber = document.getElementById('displayCardNumber');
        const displayName = document.getElementById('displayName');
        const displayExpiry = document.getElementById('displayExpiry');

        // কার্ড নাম্বার ফরম্যাট (৪ ডিজিট পর পর স্পেস)
        cardNumberInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            let formattedValue = value.match(/.{1,4}/g)?.join(' ') || '';
            e.target.value = formattedValue;
            displayCardNumber.innerText = formattedValue || '•••• •••• •••• ••••';
        });

        // কার্ডের নাম আপডেট
        cardNameInput.addEventListener('input', (e) => {
            displayName.innerText = e.target.value.toUpperCase() || 'YOUR NAME';
        });

        // এক্সপায়ারি ডেট ফরম্যাট (MM/YY)
        cardExpiryInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            if (value.length > 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value;
            displayExpiry.innerText = value || 'MM/YY';
        });

        // ফর্ম সাবমিট (ফেক)
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('successMsg').style.display = 'block';
            // ৩ সেকেন্ড পর মেসেজটি লুকিয়ে ফেলা
            setTimeout(() => {
                document.getElementById('successMsg').style.display = 'none';
                this.reset();
                displayCardNumber.innerText = '•••• •••• •••• ••••';
                displayName.innerText = 'YOUR NAME';
                displayExpiry.innerText = 'MM/YY';
            }, 3000);
        });
    </script>
</body>
</html>
