<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Foysal Raja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container { padding: 30px 5%; max-width: 800px; margin: 0 auto; display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* বাম দিকের পেমেন্ট ফর্ম */
        .payment-form { flex: 2; min-width: 300px; background: #111827; padding: 25px; border-radius: 15px; border: 1px solid #1e293b; }
        .payment-form h2 { color: #fff; margin-bottom: 20px; font-size: 1.5rem; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: #94a3b8; font-size: 0.85rem; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; background: #0b1120; border: 1px solid #334155; border-radius: 8px; color: #fff; font-family: 'Poppins', sans-serif; outline: none; }
        .input-group input:focus { border-color: #00d4ff; }
        
        .row { display: flex; gap: 15px; }
        .row .input-group { flex: 1; }
        
        .pay-btn { width: 100%; padding: 15px; background: #00d4ff; color: #0b1120; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .pay-btn:hover { background: #0ea5e9; transform: translateY(-2px); }

        /* ডান দিকের কার্ড ভিজ্যুয়াল */
        .card-visual { flex: 1; min-width: 250px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #00d4ff, #8b5cf6); border-radius: 15px; padding: 20px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden;}
        .card-chip { width: 45px; height: 35px; background: #f59e0b; border-radius: 5px; margin-bottom: 20px; }
        .card-number { font-size: 1.4rem; letter-spacing: 3px; font-family: monospace; margin-bottom: 20px; }
        .card-details { display: flex; justify-content: space-between; width: 100%; font-size: 0.9rem; text-transform: uppercase; }

        /* সাকসেস মেসেজ */
        .success-msg { display: none; background: #10b981; color: #fff; padding: 15px; border-radius: 10px; text-align: center; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><img src="logo.jpg" alt="FR Logo" class="logo-img"><span>Foysal Raja</span></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="game.html">Games</a></li>
            <li><a href="checkout.html" class="active">Checkout</a></li>
        </ul>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </nav>

    <div class="checkout-container">
        <!-- ফর্ম -->
        <div class="payment-form">
            <h2>Payment Details</h2>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Enter your card to complete the transaction.</p>
            
            <form id="fakePaymentForm">
                <div class="input-group">
                    <label>Cardholder Name</label>
                    <input type="text" placeholder="A. HASIB" required>
                </div>
                <div class="input-group">
                    <label>Card Number</label>
                    <input type="text" placeholder="4242 4242 4242 4242" required>
                </div>
                <div class="row">
                    <div class="input-group">
                        <label>Expiry Date</label>
                        <input type="text" placeholder="12/28" required>
                    </div>
                    <div class="input-group">
                        <label>CVC</label>
                        <input type="text" placeholder="123" required>
                    </div>
                </div>
                <button type="submit" class="pay-btn">Pay $1,248.00 →</button>
            </form>
            <div class="success-msg" id="successMsg">✅ Payment Successful! (This is a demo)</div>
        </div>

        <!-- কার্ড ভিজ্যুয়াল -->
        <div class="card-visual">
            <div class="card-chip"></div>
            <div class="card-number">4242 4242 4242 4242</div>
            <div class="card-details">
                <span>A. HASIB</span>
                <span>12/28</span>
            </div>
        </div>
    </div>

    <script>
        // হ্যামবার্গার মেনু
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => { hamburger.classList.toggle('active'); navLinks.classList.toggle('active'); });
            document.querySelectorAll('.nav-links a').forEach(link => { link.addEventListener('click', () => { hamburger.classList.remove('active'); navLinks.classList.remove('active'); }); });
        }

        // ফেক পেমেন্ট সাবমিট
        document.getElementById('fakePaymentForm').addEventListener('submit', function(e) {
            e.preventDefault(); // পেজ রিলোড বন্ধ করে
            document.getElementById('successMsg').style.display = 'block'; // সাকসেস মেসেজ দেখায়
            this.reset(); // ফর্ম খালি করে
        });
    </script>
</body>
</html>
