<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Puzzle 3D | Foysal Raja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* অ্যারো পাজিল গেমের জন্য এক্সক্লুসিভ স্টাইল */
        .puzzle-wrapper { padding: 10px 5%; max-width: 600px; margin: 0 auto; text-align: center; }
        
        /* টপ বার (স্কোর ও লেভেল) */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #111827; padding: 10px 15px; border-radius: 10px; 
            border: 1px solid #1e293b; margin-bottom: 15px;
        }
        .score-text { color: #fff; font-weight: bold; font-size: 1rem; }
        .score-text span { color: #00d4ff; }
        
        /* গেম গ্রিড */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            background: #0b1120;
            padding: 10px;
            border-radius: 15px;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            max-width: 320px;
            margin: 0 auto;
        }

        /* প্রতিটি ঘর */
        .cell {
            width: 100%; aspect-ratio: 1/1;
            background: #1e293b;
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            border: 1px solid #334155;
        }
        
        .cell:active { transform: scale(0.95); }
        .cell.start { background: #10b981; color: #fff; border-color: #059669; font-size: 1rem; font-weight: bold; }
        .cell.treasure { background: #f59e0b; border-color: #d97706; font-size: 1.8rem; }
        .cell.empty { background: transparent; border: 1px dashed #334155; cursor: default; }
        .cell.path { background: #00d4ff; color: #0b1120; border-color: #0284c7; } /* সঠিক পথ */
        
        .cell[data-dir="up"] { color: #00d4ff; }
        .cell[data-dir="down"] { color: #10b981; }
        .cell[data-dir="left"] { color: #f59e0b; }
        .cell[data-dir="right"] { color: #ef4444; }

        /* কন্ট্রোল বাটন */
        .controls { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn-small { padding: 10px 20px; font-size: 0.9rem; border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><img src="logo.jpg" alt="FR Logo" class="logo-img"><span>Foysal Raja</span></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="game.html" class="active">Games</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </nav>

    <div class="puzzle-wrapper">
        <a href="game.html" style="color: #00d4ff; text-decoration: none; display: block; margin-bottom: 15px; text-align: left;">← Back to Games</a>
        
        <div class="top-bar">
            <div class="score-text">Score: <span id="score">0</span></div>
            <div class="score-text">Level: <span id="level">1</span></div>
        </div>

        <div class="grid-container" id="grid"></div>

        <div class="controls">
            <button class="btn btn-outline btn-small" onclick="initGame()">Restart 🔄</button>
        </div>
    </div>

    <div class="victory-modal" id="victoryModal">
        <div class="victory-content">
            <h2 id="victoryTitle">Congratulations! 🎉</h2>
            <p id="victoryText">You Cleared the Level!</p>
            <button class="btn" onclick="playAgainAction()">Next Level</button>
        </div>
    </div>

    <audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => { hamburger.classList.toggle('active'); navLinks.classList.toggle('active'); });
            document.querySelectorAll('.nav-links a').forEach(link => { link.addEventListener('click', () => { hamburger.classList.remove('active'); navLinks.classList.remove('active'); }); });
        }

        const gridElement = document.getElementById('grid');
        const dirs = ['⬆️', '⬇️', '⬅️', '➡️'];
        let board = [];
        let score = 0;
        let level = 1;
        let startPos = 0;
        let treasurePos = 0;

        function playSound(type) {
            if(type === 'click') document.getElementById('clickSound').play().catch(e=>{});
            if(type === 'win') document.getElementById('winSound').play().catch(e=>{});
        }

        function initGame() {
            playSound('click');
            document.getElementById('score').innerText = score;
            document.getElementById('level').innerText = level;
            
            // একটি সহজ লেভেল তৈরি করা (৪x৪ গ্রিড)
            // ০ থেকে ১৫ পর্যন্ত
            board = [];
            gridElement.innerHTML = '';
            
            // ১৬টি ঘরের জন্য তীর এবং খালি জায়গা তৈরি
            for (let i = 0; i < 16; i++) {
                let cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                
                if (i === 12) { // Start Position (নিচের বাম দিকে)
                    cell.classList.add('start');
                    cell.innerText = "START";
                    startPos = 12;
                } else if (i === 3) { // Treasure Position (উপরের ডান দিকে)
                    cell.classList.add('treasure');
                    cell.innerText = "🎁";
                    treasurePos = 3;
                } else {
                    // র‍্যান্ডম তীর বসানো
                    let randomDir = dirs[Math.floor(Math.random() * dirs.length)];
                    cell.innerText = randomDir;
                    let dirName = randomDir === '⬆️' ? 'up' : randomDir === '⬇️' ? 'down' : randomDir === '⬅️' ? 'left' : 'right';
                    cell.dataset.dir = dirName;
                    cell.onclick = () => handleCellClick(i, cell);
                }
                gridElement.appendChild(cell);
                board.push(cell);
            }
        }

        function handleCellClick(index, cell) {
            if (cell.classList.contains('start') || cell.classList.contains('treasure') || cell.classList.contains('empty')) return;
            
            playSound('click');
            // তীরের দিক পরিবর্তন করা (সাইকেল: up->right->down->left->up)
            let currentDir = cell.dataset.dir;
            let nextDir = '';
            let nextIcon = '';
            
            if (currentDir === 'up') { nextDir = 'right'; nextIcon = '➡️'; }
            else if (currentDir === 'right') { nextDir = 'down'; nextIcon = '⬇️'; }
            else if (currentDir === 'down') { nextDir = 'left'; nextIcon = '⬅️'; }
            else if (currentDir === 'left') { nextDir = 'up'; nextIcon = '⬆️'; }

            cell.dataset.dir = nextDir;
            cell.innerText = nextIcon;
            cell.style.color = nextDir === 'up' ? '#00d4ff' : nextDir === 'down' ? '#10b981' : nextDir === 'left' ? '#f59e0b' : '#ef4444';

            // পাথর সরানোর লজিক (এখানে আমরা একটি নির্দিষ্ট দিকে ঠেলে দেব)
            moveArrow(index, cell, currentDir);
        }

        // একটি তীরকে তার দিকের খালি ঘরে সরানো
        function moveArrow(index, cell, direction) {
            let targetIndex = -1;
            let row = Math.floor(index / 4);
            let col = index % 4;

            if (direction === 'up' && row > 0) targetIndex = index - 4;
            if (direction === 'down' && row < 3) targetIndex = index + 4;
            if (direction === 'left' && col > 0) targetIndex = index - 1;
            if (direction === 'right' && col < 3) targetIndex = index + 1;

            if (targetIndex !== -1) {
                let targetCell = board[targetIndex];
                if (targetCell.classList.contains('empty') || targetCell.classList.contains('treasure')) {
                    // যদি টার্গেট ঘর খালি থাকে, তীরটি সেখানে চলে যাবে
                    if (targetCell.classList.contains('treasure')) {
                        // জিতে গেছেন!
                        playSound('win');
                        score += 100;
                        level++;
                        document.getElementById('score').innerText = score;
                        document.getElementById('victoryModal').classList.add('active');
                        return;
                    }
                    
                    // তীরটি সরানো হচ্ছে
                    targetCell.classList.remove('empty');
                    targetCell.classList.add('cell');
                    targetCell.innerText = cell.innerText;
                    targetCell.dataset.dir = cell.dataset.dir;
                    targetCell.style.color = cell.style.color;
                    targetCell.onclick = () => handleCellClick(targetIndex, targetCell);
                    
                    // পুরোনো ঘরটি খালি করা
                    cell.innerText = '';
                    cell.classList.remove('cell');
                    cell.classList.add('empty');
                    cell.dataset.dir = '';
                    cell.onclick = null;
                }
            }
        }

        function playAgainAction() {
            playSound('click');
            document.getElementById('victoryModal').classList.remove('active');
            // লেভেল ইনক্রিমেন্ট এবং রিসেট
            initGame();
        }

        initGame();
    </script>
</body>
</html>
