<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Demo | Foysal Raja</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .payment-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            background: #0b1120;
            perspective: 1000px;
        }
        .card {
            width: 300px;
            height: 180px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 15px;
            border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        .card:hover {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-front { background: linear-gradient(135deg, #00d4ff, #8b5cf6); color: #fff; }
        .card-back { background: #1e293b; color: #fff; transform: rotateY(180deg); }
        .chip { width: 40px; height: 30px; background: #f59e0b; border-radius: 5px; }
        .number { font-size: 1.2rem; letter-spacing: 2px; font-family: monospace; }
        .details { display: flex; justify-content: space-between; font-size: 0.8rem; text-transform: uppercase; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><img src="logo.jpg" alt="FR Logo" class="logo-img"><span>Foysal Raja</span></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="game.html">Games</a></li>
            <li><a href="payment.html" class="active">Payment</a></li>
        </ul>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </nav>

    <div class="payment-container">
        <div class="card">
            <div class="card-face card-front">
                <div class="chip"></div>
                <div class="number">4242 4242 4242 4242</div>
                <div class="details">
                    <span>A. HASIB</span>
                    <span>12/28</span>
                </div>
            </div>
            <div class="card-face card-back">
                <div style="background: #000; height: 40px; width: 100%; margin-top: 10px;"></div>
                <div style="text-align: right; margin-top: 20px;">CVC: 123</div>
            </div>
        </div>
    </div>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => { hamburger.classList.toggle('active'); navLinks.classList.toggle('active'); });
            document.querySelectorAll('.nav-links a').forEach(link => { link.addEventListener('click', () => { hamburger.classList.remove('active'); navLinks.classList.remove('active'); }); });
        }
    </script>
</body>
</html>
