<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | Foysal Raja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="logo.jpg" alt="FR Logo" class="logo-img">
            <span>Foysal Raja</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="game.html" class="active">Games</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div style="padding: 20px 5%; max-width: 600px; margin: 0 auto; text-align: center;">
        <a href="game.html" style="color: #00d4ff; text-decoration: none; display: block; margin-bottom: 20px; text-align: left;">← Back to Games</a>
        
        <h2 style="color: #fff; margin-bottom: 10px;">Tic-Tac-Toe ❌⭕</h2>
        <div id="status" style="color: #fff; font-size: 1.2rem; margin-bottom: 15px; font-weight: bold;">Your Turn (X)</div>

        <div class="ttt-board" id="board">
            <div class="ttt-cell" onclick="play(0)"></div>
            <div class="ttt-cell" onclick="play(1)"></div>
            <div class="ttt-cell" onclick="play(2)"></div>
            <div class="ttt-cell" onclick="play(3)"></div>
            <div class="ttt-cell" onclick="play(4)"></div>
            <div class="ttt-cell" onclick="play(5)"></div>
            <div class="ttt-cell" onclick="play(6)"></div>
            <div class="ttt-cell" onclick="play(7)"></div>
            <div class="ttt-cell" onclick="play(8)"></div>
        </div>
        <button class="btn" onclick="resetGame()" style="margin-top: 15px;">Restart Game</button>
    </div>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X", isGameActive = true;
        const winPatterns = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];

        function play(index) {
            if (board[index] !== "" || !isGameActive || currentPlayer !== "X") return;
            makeMove(index, "X");
            if (isGameActive) {
                document.getElementById("status").innerText = "Computer's Turn...";
                setTimeout(() => { smartComputerMove(); }, 600);
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            const cell = document.getElementById("board").children[index];
            cell.innerText = player;
            cell.style.color = player === "X" ? "#00d4ff" : "#ef4444";
            checkWinner();
            if (isGameActive) {
                currentPlayer = player === "X" ? "O" : "X";
                if (currentPlayer === "X") document.getElementById("status").innerText = "Your Turn (X)";
            }
        }

        function smartComputerMove() {
            if (!isGameActive) return;
            let bestScore = -Infinity; let move = -1;
            for (let i = 0; i < board.length; i++) {
                if (board[i] === "") {
                    board[i] = "O"; let score = minimax(board, 0, false); board[i] = "";
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
            if (move !== -1) makeMove(move, "O");
        }

        function minimax(b, depth, isMaximizing) {
            let result = checkWinForMinimax(b); if (result !== null) return result;
            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < b.length; i++) { if (b[i] === "") { b[i] = "O"; let score = minimax(b, depth + 1, false); b[i] = ""; bestScore = Math.max(score, bestScore); } } return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < b.length; i++) { if (b[i] === "") { b[i] = "X"; let score = minimax(b, depth + 1, true); b[i] = ""; bestScore = Math.min(score, bestScore); } } return bestScore;
            }
        }

        function checkWinForMinimax(b) {
            for (let i = 0; i < winPatterns.length; i++) { const [a, c, d] = winPatterns[i]; if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a] === "O" ? 10 : -10; } return b.includes("") ? null : 0;
        }

        function checkWinner() {
            let roundWon = false;
            for (let i = 0; i < winPatterns.length; i++) { const [a, b, c] = winPatterns[i]; if (board[a] && board[a] === board[b] && board[a] === board[c]) { roundWon = true; break; } }
            if (roundWon) {
                document.getElementById("status").innerText = currentPlayer === 'X' ? "You Win! 🎉" : "Computer Wins! 🤖";
                isGameActive = false; return;
            }
            if (!board.includes("")) { document.getElementById("status").innerText = "It's a Draw! 🤝"; isGameActive = false; }
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""]; currentPlayer = "X"; isGameActive = true;
            document.getElementById("status").innerText = "Your Turn (X)";
            const cells = document.getElementById("board").children;
            for (let i = 0; i < cells.length; i++) { cells[i].innerText = ""; }
        }
    </script>
</body>
</html>
