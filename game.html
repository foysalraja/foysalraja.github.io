<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games | Foysal Raja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <!-- নামের স্পেস ও ডট ফিক্স করা হয়েছে -->
        <div class="logo">
            <div class="logo-icon">FR</div>
            Foysal<span>.Raja</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="game.html" class="active">Games</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div style="padding: 30px 5%; max-width: 650px; margin: 0 auto;">
        
        <!-- ================= SNAKE GAME ================= -->
        <div class="game-section">
            <h2 style="color: #00d4ff; margin-bottom: 15px; font-size: 1.8rem;">Snake Game 🐍</h2>
            <div style="font-size: 1.2rem; margin-bottom: 10px; color: #fff;">Score: <span id="snakeScore">0</span></div>
            
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="300" height="300"></canvas>
            </div>
            
            <!-- মোবাইল কন্ট্রোল -->
            <div class="mobile-controls">
                <button onclick="setDir('UP')">⬆️</button>
                <div class="d-pad-row">
                    <button onclick="setDir('LEFT')">⬅️</button>
                    <button onclick="setDir('DOWN')">⬇️</button>
                    <button onclick="setDir('RIGHT')">➡️</button>
                </div>
            </div>
            <p style="color: #94a3b8; font-size: 0.8rem; margin-top: 10px;">(পিসিতে তীর চিহ্ন দিয়ে খেলুন)</p>
            <br>
            <button class="btn" onclick="startSnakeGame()" id="startBtnSnake">Start Game</button>
        </div>

        <!-- ================= TIC TAC TOE GAME ================= -->
        <div class="game-section">
            <h2 style="color: #00d4ff; margin-bottom: 15px; font-size: 1.8rem;">Tic-Tac-Toe ❌⭕</h2>
            
            <!-- মোড সিলেক্ট বাটন -->
            <div id="tttModeSelection" style="margin-bottom: 20px;">
                <button class="btn" style="margin: 5px; font-size: 0.9rem;" onclick="startTTT('computer')">Play with Computer 🤖</button>
                <button class="btn btn-outline" style="margin: 5px; font-size: 0.9rem;" onclick="startTTT('player')">2 Players 👥</button>
            </div>

            <!-- গেম বোর্ড (শুরুতে লুকানো) -->
            <div id="tttGameArea" style="display: none;">
                <div id="tttStatus" style="color: #fff; font-size: 1.2rem; margin-bottom: 15px; font-weight: bold;">Player X's Turn</div>
                <div class="ttt-board" id="tttBoard">
                    <!-- ৯টি সেল -->
                    <div class="ttt-cell" onclick="playTTT(0)"></div>
                    <div class="ttt-cell" onclick="playTTT(1)"></div>
                    <div class="ttt-cell" onclick="playTTT(2)"></div>
                    <div class="ttt-cell" onclick="playTTT(3)"></div>
                    <div class="ttt-cell" onclick="playTTT(4)"></div>
                    <div class="ttt-cell" onclick="playTTT(5)"></div>
                    <div class="ttt-cell" onclick="playTTT(6)"></div>
                    <div class="ttt-cell" onclick="playTTT(7)"></div>
                    <div class="ttt-cell" onclick="playTTT(8)"></div>
                </div>
                <button class="btn btn-outline" onclick="backToMenu()" style="font-size: 0.9rem;">Back to Menu</button>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Foysal Raja. All rights reserved.</p>
    </footer>

    <!-- Victory Modal (অভিনন্দন বার্তা) -->
    <div class="victory-modal" id="victoryModal">
        <div class="victory-content">
            <h2 id="victoryTitle">Congratulations! 🎉</h2>
            <p id="victoryText">You Win!</p>
            <button class="btn" onclick="closeModal()">Great!</button>
        </div>
    </div>

    <script>
        // ================= SNAKE GAME =================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("snakeScore");
        let box = 15; 
        let snake = [];
        let direction = "RIGHT";
        let nextDirection = "RIGHT";
        let food = { x: 0, y: 0 };
        let score = 0;
        let gameInterval;
        let isPlaying = false;

        function startSnakeGame() {
            if (isPlaying) return;
            isPlaying = true;
            document.getElementById("startBtnSnake").style.display = "none";
            
            snake = [{ x: 5 * box, y: 5 * box }];
            direction = "RIGHT";
            nextDirection = "RIGHT";
            score = 0;
            scoreElement.innerText = score;
            generateFood();
            
            gameInterval = setInterval(drawGame, 130);
        }

        function setDir(newDir) {
            if (!isPlaying) return;
            if (newDir === "UP" && direction !== "DOWN") nextDirection = "UP";
            if (newDir === "DOWN" && direction !== "UP") nextDirection = "DOWN";
            if (newDir === "LEFT" && direction !== "RIGHT") nextDirection = "LEFT";
            if (newDir === "RIGHT" && direction !== "LEFT") nextDirection = "RIGHT";
        }

        function generateFood() {
            food = { x: Math.floor(Math.random() * 18 + 1) * box, y: Math.floor(Math.random() * 18 + 1) * box };
        }

        function drawGame() {
            direction = nextDirection;
            ctx.fillStyle = "#0b1120";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // খাবার
            ctx.fillStyle = "#ef4444";
            ctx.fillRect(food.x, food.y, box, box);

            // সাপ
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? "#00d4ff" : "#0ea5e9";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (direction === "LEFT") snakeX -= box;
            if (direction === "UP") snakeY -= box;
            if (direction === "RIGHT") snakeX += box;
            if (direction === "DOWN") snakeY += box;

            if (snakeX === food.x && snakeY === food.y) {
                score++;
                scoreElement.innerText = score;
                generateFood();
            } else { snake.pop(); }

            let newHead = { x: snakeX, y: snakeY };

            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(gameInterval);
                isPlaying = false;
                document.getElementById("startBtnSnake").style.display = "inline-block";
                document.getElementById("startBtnSnake").innerText = "Play Again";
                showVictory("Game Over!", "Your Score: " + score);
                return;
            }
            snake.unshift(newHead);
        }

        function collision(head, array) {
            for (let i = 1; i < array.length; i++) {
                if (head.x === array[i].x && head.y === array[i].y) return true;
            }
            return false;
        }

        // পিসিতে তীর চিহ্ন
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp") setDir("UP");
            if (e.key === "ArrowDown") setDir("DOWN");
            if (e.key === "ArrowLeft") setDir("LEFT");
            if (e.key === "ArrowRight") setDir("RIGHT");
        });


        // ================= TIC TAC TOE (কম্পিউটার মোড) =================
        let tttBoard = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;
        let playMode = "player"; 
        const winPatterns = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];

        function startTTT(mode) {
            playMode = mode;
            resetTTT();
            document.getElementById("tttModeSelection").style.display = "none";
            document.getElementById("tttGameArea").style.display = "block";
            
            if(playMode === 'computer') {
                document.getElementById("tttStatus").innerText = "Your Turn (X)";
            } else {
                document.getElementById("tttStatus").innerText = "Player X's Turn";
            }
        }

        function backToMenu() {
            document.getElementById("tttModeSelection").style.display = "block";
            document.getElementById("tttGameArea").style.display = "none";
        }

        function playTTT(index) {
            if (tttBoard[index] !== "" || !isGameActive) return;

            makeMove(index, currentPlayer);

            if (isGameActive && playMode === 'computer') {
                setTimeout(computerMove, 500); // কম্পিউটারের চাল ০.৫ সেকেন্ড পর
            }
        }

        function makeMove(index, player) {
            tttBoard[index] = player;
            const cell = document.getElementById("tttBoard").children[index];
            cell.innerText = player;
            cell.style.color = player === "X" ? "#00d4ff" : "#ef4444";
            
            checkWinner();
            
            if (isGameActive) {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                if(playMode === 'computer') {
                    document.getElementById("tttStatus").innerText = currentPlayer === 'X' ? "Your Turn (X)" : "Computer's Turn (O)";
                } else {
                    document.getElementById("tttStatus").innerText = `Player ${currentPlayer}'s Turn`;
                }
            }
        }

        function computerMove() {
            if (!isGameActive) return;
            
            let emptyCells = [];
            for (let i = 0; i < tttBoard.length; i++) {
                if (tttBoard[i] === "") emptyCells.push(i);
            }
            
            if (emptyCells.length > 0) {
                let randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                makeMove(randomIndex, "O");
            }
        }

        function checkWinner() {
            let roundWon = false;
            for (let i = 0; i < winPatterns.length; i++) {
                const [a, b, c] = winPatterns[i];
                if (tttBoard[a] && tttBoard[a] === tttBoard[b] && tttBoard[a] === tttBoard[c]) {
                    roundWon = true; break;
                }
            }

            if (roundWon) {
                document.getElementById("tttStatus").innerText = `Player ${currentPlayer} Wins! 🎉`;
                isGameActive = false;
                
                let winMsg = playMode === 'computer' && currentPlayer === 'X' ? "You beat the Computer!" : `Player ${currentPlayer} Wins!`;
                showVictory("Congratulations! 🎉", winMsg);
                return;
            }

            if (!tttBoard.includes("")) {
                document.getElementById("tttStatus").innerText = "It's a Draw! 🤝";
                isGameActive = false;
                return;
            }
        }

        function resetTTT() {
            tttBoard = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            const cells = document.getElementById("tttBoard").children;
            for (let i = 0; i < cells.length; i++) { cells[i].innerText = ""; }
        }

        // Victory Modal
        function showVictory(title, text) {
            document.getElementById("victoryTitle").innerText = title;
            document.getElementById("victoryText").innerText = text;
            document.getElementById("victoryModal").classList.add("active");
        }
        function closeModal() {
            document.getElementById("victoryModal").classList.remove("active");
        }
    </script>
</body>
</html>
