<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foysal Raja - Web Developer & Gamer</title>
    <style>
        /* =========================================
           গ্লোবাল স্টাইল (Global Styles)
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1120; /* গাঢ় নীল/কালো ব্যাকগ্রাউন্ড */
            color: #ffffff;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================================
           হেডার এবং নেভিগেশন (Header & Nav)
           ========================================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #0b1120;
            border-bottom: 1px solid #1f2937;
            flex-wrap: wrap; /* মোবাইলের জন্য */
            gap: 15px;
        }

        /* লোগো এবং নাম একসাথে */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            background-color: #00d2ff;
            color: #0b1120;
            font-weight: bold;
            font-size: 20px;
            padding: 8px 12px;
            border-radius: 8px;
            letter-spacing: 1px;
        }

        .site-title {
            font-size: 24px; /* নাম একটু বড় করা হয়েছে */
            font-weight: 600;
            color: #ffffff;
            margin: 0;
        }

        /* মেনু বার */
        nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            font-size: 16px;
            font-weight: 500;
            color: #a0aec0;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #00d2ff;
        }

        /* =========================================
           মেইন কন্টেন্ট এরিয়া (Main Content)
           ========================================= */
        main {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 150px);
        }

        /* =========================================
           গেম সেকশন (Game Section)
           ========================================= */
        .game-container {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .game-title {
            font-size: 28px;
            margin-bottom: 10px;
            color: #00d2ff;
        }
        
        .game-title span {
            color: #ff4757; /* O এর রঙ */
        }

        #status {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            height: 27px; /* লেআউট যাতে নড়াচড়া না করে */
            color: #e2e8f0;
        }

        /* ৩x৩ গ্রিড বোর্ড */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .cell {
            background-color: #0b1120;
            border: 2px solid #1f2937;
            border-radius: 12px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            color: #00d2ff; /* X এর রঙ */
            transition: all 0.2s ease;
        }

        .cell:hover {
            border-color: #00d2ff;
            background-color: #0f172a;
        }

        .cell.o {
            color: #ff4757; /* O এর রঙ */
        }

        /* বাটন স্টাইল */
        .btn {
            background-color: transparent;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover {
            background-color: #00d2ff;
            color: #0b1120;
        }

        .btn-outline {
            color: #a0aec0;
            border-color: #4a5568;
        }

        .btn-outline:hover {
            background-color: #4a5568;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- হেডার সেকশন -->
    <header>
        <div class="logo-container">
            <div class="logo">FR</div>
            <h1 class="site-title">Foysal Raja</h1> <!-- ডট সরানো হয়েছে এবং নাম বড় করা হয়েছে -->
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#" class="active">Games</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- মেইন কন্টেন্ট (গেম) -->
    <main>
        <div class="game-container">
            <h2 class="game-title">Tic-Tac-Toe <span>X O</span></h2>
            <div id="status">Your Turn (X)</div>
            
            <!-- গেম বোর্ড -->
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <!-- বাটনসমূহ -->
            <button class="btn" id="restartBtn">Play Again</button>
            <button class="btn btn-outline" onclick="window.location.href='index.html'">Back to Menu</button>
        </div>
    </main>

    <!-- =========================================
         জাভাস্ক্রিপ্ট (গেমের লজিক ও AI)
         ========================================= -->
    <script>
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const restartBtn = document.getElementById('restartBtn');

        let boardState = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;
        const HUMAN = "X";
        const COMPUTER = "O";

        // জেতার সম্ভাব্য সব দিক
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // সারি (Rows)
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // কলাম (Columns)
            [0, 4, 8], [2, 4, 6]             // কর্ণ (Diagonals)
        ];

        // ক্লিক ইভেন্ট
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', restartGame);

        function handleCellClick(clickedCellEvent) {
            const clickedCell = clickedCellEvent.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            // যদি ঘর খালি না থাকে বা গেম শেষ হয়ে যায়, তাহলে কিছুই করবে না
            if (boardState[clickedCellIndex] !== "" || !gameActive) return;

            // ১. মানুষের চাল (X)
            makeMove(clickedCellIndex, HUMAN);

            // ২. যদি গেম এখনো শেষ না হয়, কম্পিউটারের চাল (O)
            if (gameActive) {
                statusText.innerText = "Computer is thinking...";
                setTimeout(() => {
                    const bestMove = getBestMove(boardState, COMPUTER);
                    makeMove(bestMove, COMPUTER);
                }, 400); // ০.৪ সেকেন্ড দেরি করে চালবে
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            cells[index].innerText = player;
            if (player === COMPUTER) cells[index].classList.add('o');
            
            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            let winner = null;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    roundWon = true;
                    winner = boardState[a];
                    break;
                }
            }

            if (roundWon) {
                statusText.innerText = winner === HUMAN ? "You Win! 🎉" : "Computer Wins! 🤖";
                gameActive = false;
                return;
            }

            // ড্র চেক
            if (!boardState.includes("")) {
                statusText.innerText = "It's a Draw! 🤝";
                gameActive = false;
                return;
            }

            // পরের টার্ন কার
            if (gameActive) {
                statusText.innerText = "Your Turn (X)";
            }
        }

        // রিস্টার্ট ফাংশন
        function restartGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            statusText.innerText = "Your Turn (X)";
            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove('o');
            });
        }

        // ==========================================
        // বুদ্ধিমান কম্পিউটার (Minimax Algorithm)
        // ==========================================
        function checkWin(board, player) {
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] === player && board[b] === player && board[c] === player) return true;
            }
            return false;
        }

        function getBestMove(newBoard, player) {
            // ১. কম্পিউটার কি জিততে পারবে? যদি পারে, জিতে যাবে।
            for (let i = 0; i < newBoard.length; i++) {
                if (newBoard[i] === "") {
                    newBoard[i] = COMPUTER;
                    if (checkWin(newBoard, COMPUTER)) { newBoard[i] = ""; return i; }
                    newBoard[i] = "";
                }
            }

            // ২. মানুষ কি জিততে যাচ্ছে? যদি যায়, ব্লক করবে।
            for (let i = 0; i < newBoard.length; i++) {
                if (newBoard[i] === "") {
                    newBoard[i] = HUMAN;
                    if (checkWin(newBoard, HUMAN)) { newBoard[i] = ""; return i; }
                    newBoard[i] = "";
                }
            }

            // ৩. মাঝখানে খালি থাকলে মাঝখানে মারবে।
            if (newBoard[4] === "") return 4;

            // ৪. অন্যথায় যেকোনো একটি খালি ঘর বেছে নেবে।
            const availableSpots = newBoard.map((val, index) => val === "" ? index : null).filter(val => val !== null);
            return availableSpots[Math.floor(Math.random() * availableSpots.length)];
        }
    </script>
</body>
</html>
