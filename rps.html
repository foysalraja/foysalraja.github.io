<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors | Foysal Raja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="logo.jpg" alt="FR Logo" class="logo-img">
            <span>Foysal Raja</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="game.html" class="active">Games</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div style="padding: 20px 5%; max-width: 600px; margin: 0 auto; text-align: center;">
        <a href="game.html" style="color: #00d4ff; text-decoration: none; display: block; margin-bottom: 20px; text-align: left;">← Back to Games</a>
        
        <h2 style="color: #fff; margin-bottom: 20px;">Rock Paper Scissors ✊✋✌️</h2>
        
        <div style="font-size: 3rem; margin-bottom: 20px;">
            <button style="background:none; border:none; font-size:3rem; cursor:pointer;" onclick="playRPS('rock')">✊</button>
            <button style="background:none; border:none; font-size:3rem; cursor:pointer;" onclick="playRPS('paper')">✋</button>
            <button style="background:none; border:none; font-size:3rem; cursor:pointer;" onclick="playRPS('scissors')">✌️</button>
        </div>

        <div id="result" style="color: #fff; font-size: 1.2rem; margin-bottom: 10px;">Choose your move!</div>
        <div id="scoreBoard" style="color: #00d4ff; font-weight: bold;">You: 0 | Computer: 0</div>
    </div>

    <script>
        let pScore = 0, cScore = 0;
        function playRPS(playerChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const cChoice = choices[Math.floor(Math.random() * 3)];
            let result = "";
            if (playerChoice === cChoice) { result = "It's a tie! 🤝"; } 
            else if ((playerChoice === 'rock' && cChoice === 'scissors') || (playerChoice === 'paper' && cChoice === 'rock') || (playerChoice === 'scissors' && cChoice === 'paper')) { result = "You win! 🎉"; pScore++; } 
            else { result = "Computer wins! 🤖"; cScore++; }

            document.getElementById("result").innerText = `You: ${playerChoice}, PC: ${cChoice}. ${result}`;
            document.getElementById("scoreBoard").innerText = `You: ${pScore} | Computer: ${cScore}`;

            if (pScore === 3) {
                setTimeout(() => alert("🏆 You Won the Match!"), 100); pScore = 0; cScore = 0;
                document.getElementById("scoreBoard").innerText = `You: 0 | Computer: 0`;
            } else if (cScore === 3) {
                setTimeout(() => alert("🤖 Computer Won the Match!"), 100); pScore = 0; cScore = 0;
                document.getElementById("scoreBoard").innerText = `You: 0 | Computer: 0`;
            }
        }
    </script>
</body>
</html>
